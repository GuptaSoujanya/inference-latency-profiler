[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-latency-profiler"
version = "0.2.8"
description = "Microsecond-precision profiler for measuring token generation latency (TTFT, ITL) across LLM backends."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
llm-profile = "profiler.cli:main"
